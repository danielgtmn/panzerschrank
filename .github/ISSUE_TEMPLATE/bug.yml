name: Bug report
description: Something does not work as described
labels: ["type: bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead. Never paste real keys or secrets.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Ideally a short Go test.
      render: go
  - type: input
    id: version
    attributes:
      label: panzerschrank version
      description: From your go.mod.
      placeholder: v0.1.0
    validations:
      required: true
